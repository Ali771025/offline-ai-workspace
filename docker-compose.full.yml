name: offline-ai-hub-full
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [aihub]

  redis:
    image: ${REDIS_IMAGE}
    container_name: ai-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [aihub]

  qdrant:
    image: ${QDRANT_IMAGE}
    container_name: ai-qdrant
    restart: unless-stopped
    ports: ["6333:6333","6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    networks: [aihub]

  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0
    container_name: ai-litellm
    restart: unless-stopped
    depends_on: [postgres, redis]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["4000:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config","/app/config.yaml","--port","4000","--num_workers","2"]
    networks: [aihub]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: ai-open-webui
    restart: unless-stopped
    depends_on: [litellm, qdrant]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:8080"]
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: "Offline AI Hub"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OLLAMA_API: "True"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
    volumes: [openwebui_data:/app/backend/data]
    networks: [aihub]

  gitea:
    image: gitea/gitea:1.27.3
    container_name: ai-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: ${SERVER_IP}
      GITEA__server__ROOT_URL: http://${SERVER_IP}:3001/
      GITEA__server__SSH_DOMAIN: ${SERVER_IP}
      GITEA__server__SSH_PORT: "2222"
    ports: ["3001:3000","2222:22"]
    volumes: [gitea_data:/data]
    networks: [aihub]

  nginx:
    image: nginx:1.29-alpine
    container_name: ai-nginx
    restart: unless-stopped
    depends_on: [open-webui, litellm, gitea]
    ports: ["8080:80"]
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [aihub]

networks:
  aihub:
    name: offline-ai-hub-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  openwebui_data:
  gitea_data:
