name: offline-ai-hub

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0
    container_name: ai-litellm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    networks: [aihub]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: ai-open-webui
    restart: unless-stopped
    depends_on:
      - litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: "Offline AI Hub"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OLLAMA_API: "True"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      QDRANT_URI: http://${QDRANT_HOST}:${QDRANT_PORT}
      VECTOR_DB: qdrant
    volumes:
      - openwebui_data:/app/backend/data
    networks: [aihub]

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5
    container_name: ai-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: http://${SERVER_IP}:3001/
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__DOMAIN: ${SERVER_IP}
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - forgejo_data:/data
    networks: [aihub]

  nginx:
    image: nginx:1.29-alpine
    container_name: ai-nginx
    restart: unless-stopped
    depends_on:
      - open-webui
      - litellm
      - forgejo
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [aihub]

networks:
  aihub:
    name: offline-ai-hub-net

volumes:
  openwebui_data:
  forgejo_data:
